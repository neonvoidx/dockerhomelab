version: "3"
services:
  # Only Traefik can reach this API proxy; never publish port 2375.
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_PAUSE: "0"
      ALLOW_UNPAUSE: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    labels:
      - "traefik.enable=false"

  traefik:
    secrets:
      - cloudflare_dns_api_token
    image: traefik:v3.7.16@sha256:22a759fb803abb5c3a7ba5d5a55a201c5fb0fc8993d5c72c47a89075e64f1953
    container_name: traefik
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - docker-socket-proxy
    networks:
      - media
      - rss
      - books
      - docker-api
      - management
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --api=true
      - --api.insecure=true
      - --api.dashboard=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/config/acme.json
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt
      - --entrypoints.websecure.http.tls.domains[0].main=${BASE_DOMAIN_NAME}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${BASE_DOMAIN_NAME}
      - --log.level=INFO
    environment:
      - CLOUDFLARE_EMAIL=${EMAIL}
      - CLOUDFLARE_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_dns_api_token
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 8080
        mode: host
    volumes:
      - ./traefik:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.middlewares.middleware-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32,192.168.86.0/24"
      - "traefik.http.routers.traefik.middlewares=middleware-ipwhitelist"

  sabnzbd:
    networks:
      - media
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`nzb.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls.certresolver=letsencrypt"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.middleware-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32,192.168.86.0/24"
      - "traefik.http.routers.sabnzbd.middlewares=middleware-ipwhitelist"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./sabnzbd:/config
      - /nzb:/downloads
      - /nzb/incomplete:/incomplete-downloads
    restart: unless-stopped

  radarr:
    networks:
      - media
    depends_on:
      - sabnzbd
    image: linuxserver/radarr
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.middlewares.middleware-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32,192.168.86.0/24"
      - "traefik.http.routers.radarr.middlewares=middleware-ipwhitelist"
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /docker-configs/radarr:/config
      - /movies:/movies
      - /nzb:/downloads
      - /torrent:/data/torrents
    restart: unless-stopped

  sonarr:
    networks:
      - media
    depends_on:
      - sabnzbd
    image: linuxserver/sonarr
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.middlewares.middleware-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32,192.168.86.0/24"
      - "traefik.http.routers.sonarr.middlewares=middleware-ipwhitelist"
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SONARR__AUTH_METHOD="External"
    volumes:
      - /docker-configs/sonarr:/config
      - /tv:/tv
      - /nzb:/downloads
      - /torrent:/data/torrents
    restart: unless-stopped
  lidarr:
    networks:
      - media
    depends_on:
      - sabnzbd
    image: linuxserver/lidarr
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.routers.lidarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
      - "traefik.http.middlewares.middleware-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32,192.168.86.0/24"
      - "traefik.http.routers.lidarr.middlewares=middleware-ipwhitelist"
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LIDARR__AUTH_METHOD="External"
    volumes:
      - /docker-configs/lidarr:/config
      - /music:/music
      - /nzb:/downloads
      - /torrent:/data/torrents
    restart: unless-stopped
  tautulli:
    networks:
      - media
    image: ghcr.io/tautulli/tautulli
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.tautulli.entrypoints=websecure"
      - "traefik.http.routers.tautulli.tls.certresolver=letsencrypt"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"
      - "traefik.http.middlewares.middleware-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32,192.168.86.0/24"
      - "traefik.http.routers.tautulli.middlewares=middleware-ipwhitelist"
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - ./tautulli:/config
      - ./posterizarr:/posterizarr:rw
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  seerr:
    networks:
      - media
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.overseerr.rule=Host(`request.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.overseerr.entrypoints=websecure"
      - "traefik.http.routers.overseerr.tls.certresolver=letsencrypt"
      - "traefik.http.services.overseerr.loadbalancer.server.port=5055"
    container_name: seerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./overseerr:/app/config
    restart: unless-stopped

  cloudflare-ddns:
    secrets:
      - cloudflare_ddns_api_key
    image: oznu/cloudflare-ddns
    container_name: cloudflare-ddns
    restart: always
    environment:
      - API_KEY_FILE=/run/secrets/cloudflare_ddns_api_key
      - ZONE=${BASE_DOMAIN_NAME}
      - SUBDOMAIN=${SUBDOMAIN}
      - PROXIED=true
      - RRTYPE=A

  prowlarr:
    networks:
      - media
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.middlewares.middleware-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32,192.168.86.0/24"
      - "traefik.http.routers.prowlarr.middlewares=middleware-ipwhitelist"
    volumes:
      - ./prowlarr:/config
    restart: unless-stopped

  autoscan-adapter:
    networks:
      - media
    depends_on:
      - plex
    image: dantebarba/autoscan-adapter
    container_name: autoscan-adapter
    restart: unless-stopped
    environment:
      PGID: ${PGID}
      PUID: ${PUID}
      PLEX_URL: http://plex:32400
      PLEX_TOKEN: ${PLEX_TOKEN}

  autoscan:
    networks:
      - media
    image: cloudb0x/autoscan
    container_name: autoscan
    restart: unless-stopped
    environment:
      PGID: ${PGID}
      PUID: ${PUID}
    depends_on:
      - autoscan-adapter
    volumes:
      - ./plex-autoscan:/config
      - /tv:/tv
      - /movies:/movies

  plex:
    networks:
      - media
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    ports:
      - "32400:32400/tcp"
      - "3005:3005/tcp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=latest
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /docker-configs/plex:/config
      - /tv:/tv
      - /movies:/movies
      - /prerolls:/prerolls
    restart: unless-stopped
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.routers.plex.tls.certresolver=letsencrypt"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"

  notifiarr:
    networks:
      - media
    image: golift/notifiarr
    container_name: notifiarr
    restart: unless-stopped
    hostname: notifiarr
    environment:
      - TZ=${TZ}
      - PGID=${PGID}
      - PUID=${PUID}
    volumes:
      - ./notifiarr:/config
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.notifiarr.rule=Host(`notifiarr.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.notifiarr.entrypoints=websecure"
      - "traefik.http.routers.notifiarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.notifiarr.loadbalancer.server.port=5454"
      - "traefik.http.routers.notifiarr.middlewares=middleware-ipwhitelist"

  # jellyfin:
  #   image: lscr.io/linuxserver/jellyfin:latest
  #   container_name: jellyfin
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
