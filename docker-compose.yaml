  kometa:
    networks:
      - media
    depends_on:
      - plex
    image: kometateam/kometa:latest
    container_name: kometa
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PGID=${PGID}
      - PUID=${PUID}
      - KOMETA_CONFIG=/config/config.yml
      - KOMETA_TIMES=07:00,17:00
      - KOMETA_plextoken=${PLEX_TOKEN}
      - KOMETA_plexurl=${PLEX_URL}
      - KOMETA_traktclientid=${TRAKT_CLIENT_ID}
      - KOMETA_traktclientsecret=${TRAKT_CLIENT_SECRET}
      - KOMETA_tmdbapikey=${TMDB_API_KEY}
      - KOMETA_mdbapikey=${MDB_API_KEY}
      - KOMETA_RUN=false
    volumes:
      - /docker-configs/kometa:/config

  gluetun:
    secrets:
      - wireguard_private_key
    networks:
      - media
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - 9977:9977
      - 8888:8888/tcp
      - 6881:6881
      - 6881:6881/udp
      - 51820:51820
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/wireguard_private_key
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ}
      - QBT_WEBUI_ENABLED=true
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - UPDATER_PERIOD=24h
    volumes:
      - ./gluetun:/gluetun

  qbt_port_forward:
    image: mjmeli/qbittorrent-port-forward-gluetun-server
    network_mode: "service:gluetun"
    container_name: qbt_port_forward
    environment:
      QBT_USERNAME: ${QBT_USERNAME}
      QBT_PASSWORD: ${QBT_PASSWORD}
      QBT_ADDR: http://127.0.0.1:9977
      GTN_ADDR: http://127.0.0.1:8000
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - gluetun

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:libtorrentv1
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=9977
      - QBITTORRENT_WEBUI_PORT=9977
    volumes:
      - ./qbittorrent:/config
      - /torrent:/downloads
    ulimits:
      nofile:
        soft: 32768
        hard: 65536
    restart: unless-stopped
    depends_on:
      - gluetun
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`torrent.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=9977"
      - "traefik.http.routers.qbittorrent.middlewares=middleware-ipwhitelist"

  plex-image-cleanup:
    networks:
      - media
    image: meisnate12/plex-image-cleanup
    container_name: plex-image-cleanup
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_URL=${PLEX_URL}
      - SCHEDULE=${SCHEDULE}
    volumes:
      - ./plex-image-cleanup:/config
      - /docker-configs/plex:/plex
    restart: unless-stopped

  posterizarr:
    networks:
      - media
    hostname: "posterizarr"
    container_name: "posterizarr"
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - "RUN_TIME=05:00,18:00"
      - DISABLE_UI=false
    image: "ghcr.io/fscorrupt/posterizarr:latest"
    restart: "unless-stopped"
    volumes:
      - "./posterizarr:/config"
      - "/docker-configs/kometa/assets:/assets"
      - "/docker-configs/kometa/assetsbackup:/assetsbackup"
      - "/docker-configs/kometa/manualassets:/manualassets"
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_media"
      - "traefik.enable=true"
      - "traefik.http.routers.posterizarr.rule=Host(`poster.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.posterizarr.entrypoints=websecure"
      - "traefik.http.routers.posterizarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.posterizarr.loadbalancer.server.port=8000"
      - "traefik.http.routers.posterizarr.middlewares=middleware-ipwhitelist"

  freshrss:
    networks:
      - rss
    hostname: "freshrss"
    container_name: "freshrss"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CRON_MIN=*/1
      - TRUSTED_PROXY="192.168.86.0/24"
      - SERVER_DNS=rss.${BASE_DOMAIN_NAME}
      - LISTEN=0.0.0.0:80
    image: "freshrss/freshrss:latest"
    build:
      context: https://github.com/FreshRSS/FreshRSS.git#edge
      dockerfile: Docker/Dockerfile-Alpine
    restart: "unless-stopped"
    logging:
      options:
        max-size: 512m
    volumes:
      - "./freshrss/data:/var/www/FreshRSS/data"
      - "./freshrss/extensions:/var/www/FreshRSS/extensions"
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_rss"
      - "traefik.enable=true"
      - "traefik.http.routers.freshrss.rule=Host(`rss.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.routers.freshrss.tls.certresolver=letsencrypt"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"

  kavita:
    networks:
      - books
    hostname: "kavita"
    container_name: "kavita"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    image: "lscr.io/linuxserver/kavita:latest"
    restart: "unless-stopped"
    volumes:
      - "./kavita/config:/config"
      - "/books:/books"
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_books"
      - "traefik.enable=true"
      - "traefik.http.routers.books.rule=Host(`books.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.books.entrypoints=websecure"
      - "traefik.http.routers.books.tls.certresolver=letsencrypt"
      - "traefik.http.services.books.loadbalancer.server.port=5000"

  portainer:
    image: portainer/portainer-ce:sts
    container_name: portainer
    networks:
      - management
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${BASE_DOMAIN_NAME}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.middleware-ipwhitelist.ipallowlist.sourcerange=127.0.0.1/32,192.168.86.0/24"
      - "traefik.http.routers.portainer.middlewares=middleware-ipwhitelist"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data
    restart: unless-stopped

